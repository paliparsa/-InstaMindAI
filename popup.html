<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstaMind AI</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="mark">IM</div><div><h1>InstaMind <b>AI</b></h1><small>Instagram account review</small></div><button id="settings" class="gear" title="Settings">⚙</button></header>
<section class="hero"><small>YOUR REVIEW SPACE</small><h2>Make your following list clearer.</h2><p>Collect visible accounts, review profiles and keep decisions in your browser.</p></section>
<section class="stats"><div><strong id="total">0</strong><small>Accounts</small></div><div><strong id="kept">0</strong><small>Kept</small></div><div><strong id="review">0</strong><small>To review</small></div></section>
<section class="actions"><button id="manageAccounts" class="secondary">Open account manager</button><button id="collect" class="primary">Collect visible accounts</button><button id="reviewAll" class="secondary">Review all collected accounts</button><button id="analyze" class="secondary">Analyze current profile with AI</button><p id="status" role="status">Open Instagram to get started.</p></section>
<section class="tools"><input id="search" placeholder="Search accounts…" type="search" aria-label="Search accounts"><select id="filter" aria-label="Filter accounts"><option value="all">All accounts</option><option value="review">To review</option><option value="keep">Kept</option><option value="unreviewed">Not analyzed</option><option value="flagged">Flagged for review</option></select></section>
<section id="accounts"></section><section id="analysis" class="analysis hidden"></section>
<footer><button id="json">Export JSON</button><button id="csv">Export CSV</button><button id="clear" class="danger">Clear data</button></footer><p class="privacy">Local-first · No automatic unfollowing · AI review is opt-in</p><script src="popup.js"></script></body></html>
