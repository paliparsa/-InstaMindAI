name: Build Chrome package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chrome/manifest.json"
      - "background.js"
      - "content.js"
      - "popup.js"
      - "options.js"
      - "popup.html"
      - "options.html"
      - "popup.css"
      - "review.html"
      - "review.js"
      - "review.css"
      - ".github/workflows/chrome-package.yml"
  pull_request:
    branches: [main]
    paths:
      - "chrome/manifest.json"
      - "background.js"
      - "content.js"
      - "popup.js"
      - "options.js"
      - "popup.html"
      - "options.html"
      - "popup.css"
      - "review.html"
      - "review.js"
      - "review.css"
      - ".github/workflows/chrome-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stage Chrome extension
        run: |
          mkdir -p extension dist
          cp chrome/manifest.json extension/manifest.json
          cp background.js content.js popup.js options.js popup.html options.html popup.css review.html review.js review.css accounts.html accounts.js accounts.css extension/
          test -f extension/manifest.json
          node -e "const m=require('./extension/manifest.json'); if(m.manifest_version!==3 || !m.background.service_worker || !m.action) process.exit(1)"
          echo "Chrome extension root:"
          find extension -maxdepth 1 -type f -printf '%f\\n' | sort

      - name: Validate Chrome extension
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/options.js
          node --check extension/review.js
          node <<'NODE'
          const fs = require('fs');
          const m = JSON.parse(fs.readFileSync('extension/manifest.json', 'utf8'));
          if (m.manifest_version !== 3) throw new Error('Chrome package must use Manifest V3');
          if (!m.background?.service_worker) throw new Error('Missing MV3 service worker');
          if (!m.action?.default_popup) throw new Error('Missing Chrome action popup');
          for (const file of ['popup.html','popup.css','popup.js','options.html','options.js','background.js','content.js','review.html','review.js','review.css','accounts.html','accounts.js','accounts.css']) {
            if (!fs.existsSync('extension/' + file)) throw new Error('Missing extension file: ' + file);
          }
          console.log('Manifest V3 and extension files validated.');
          NODE

      - name: Build Chrome ZIP
        run: |
          cd extension
          zip -r ../dist/instamind-ai-chrome.zip .
          cd ..
          unzip -Z1 dist/instamind-ai-chrome.zip | grep -qx 'manifest.json'
          unzip -p dist/instamind-ai-chrome.zip manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.manifest_version!==3)process.exit(1)})"
          echo "Verified manifest.json at ZIP root."

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: instamind-ai-chrome
          path: dist/instamind-ai-chrome.zip
          if-no-files-found: error
          retention-days: 14
