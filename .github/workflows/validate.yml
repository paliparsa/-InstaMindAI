name: Validate extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - name: Check JavaScript syntax
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js
          node --check accounts.js
          node --check options.js
          node --check review.js
          node --check background.js
      - name: Test content-script messaging
        run: node tests/content-script.test.js
      - name: Test Instagram JSON import
        run: node tests/instagram-import.test.js
