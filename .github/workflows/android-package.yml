name: Build Firefox Android package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "*.js"
      - "*.html"
      - "*.css"
      - "android/**"
      - ".github/workflows/android-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint WebExtension
        run: npx --yes web-ext@latest lint --source-dir .
      - name: Build unsigned package
        run: npx --yes web-ext@latest build --source-dir . --artifacts-dir dist --overwrite-dest --ignore-files README.md android/** .github/** package.json
      - name: Sign for self-distribution (when AMO secrets are configured)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [ -n "$AMO_JWT_ISSUER" ] && [ -n "$AMO_JWT_SECRET" ]; then
            npx --yes web-ext@latest sign --source-dir . --artifacts-dir dist --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --channel unlisted --ignore-files README.md android/** .github/** package.json
          else
            echo "AMO secrets not configured; only the unsigned ZIP will be available."
          fi
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: instamind-firefox-android
          path: dist/*
          if-no-files-found: error
          retention-days: 14
